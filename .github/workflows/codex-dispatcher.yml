name: Codex dispatcher
run-name: Codex dispatcher comment ${{ github.event.comment.id }}
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  actions: read
concurrency:
  group: codex-dispatch-comment-${{ github.event.comment.id }}
jobs:
  smoke:
    if: github.repository == 'dsavill-png/DebateOS' && github.ref == 'refs/heads/main' && github.event.issue.number == 1 && github.event.issue.pull_request && github.actor == 'dsavill-png' && github.event.sender.login == 'dsavill-png' && github.event.comment.user.login == 'dsavill-png'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify source and reserve smoke-only command
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_RUN_ATTEMPT" != 1 ]]; then exit 0; fi
          id=$(jq -er '.comment.id | numbers | tostring | select(test("^[0-9]+$"))' "$GITHUB_EVENT_PATH")
          record=$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$id")
          if ! jq -e --arg id "$id" --arg repo "$GITHUB_REPOSITORY" --slurpfile event "$GITHUB_EVENT_PATH" '
            (.id | tostring) == $id and
            .issue_url == ("https://api.github.com/repos/" + $repo + "/issues/1") and
            .user.login == "dsavill-png" and .user.type == "User" and
            (.created_at | type) == "string" and .created_at == .updated_at and
            .body == $event[0].comment.body and
            (.body | gsub("^\\s+|\\s+$"; "")) == "CODEX TASK-000"
          ' <<<"$record" >/dev/null; then exit 0; fi
          first_run=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/codex-dispatcher.yml/runs?event=issue_comment&per_page=100" |
            jq -sr --arg title "Codex dispatcher comment $id" '[.[].workflow_runs[] | select(.display_title == $title) | .id] | min')
          if [[ "$first_run" != "$GITHUB_RUN_ID" ]]; then exit 0; fi
          echo 'accepted=true' >> "$GITHUB_OUTPUT"
      - name: Check out trusted main commit
        if: steps.gate.outputs.accepted == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run harmless read-only Codex smoke test
        if: steps.gate.outputs.accepted == 'true'
        uses: openai/codex-action@306c6a196a99dcc6582530c396a19d2672d5e9ec
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":read-only"
          prompt: Read AGENTS.md and PLANS.md in this trusted checkout. Perform no work order and make no changes. Return only DEBATEOS_CODEX_SMOKE_OK.
          output-file: ${{ runner.temp }}/codex-smoke.txt
      - name: Verify result
        if: steps.gate.outputs.accepted == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat "$RUNNER_TEMP/codex-smoke.txt")" = DEBATEOS_CODEX_SMOKE_OK
          test -z "$(git status --porcelain)"
          echo "Read-only Codex smoke test passed for source comment $(jq -r '.comment.id' "$GITHUB_EVENT_PATH")." >> "$GITHUB_STEP_SUMMARY"

  route:
    if: github.repository == 'dsavill-png/DebateOS' && github.ref == 'refs/heads/main' && github.event.issue.number == 1 && github.event.issue.pull_request && github.actor == 'dsavill-png' && github.event.sender.login == 'dsavill-png' && github.event.comment.user.login == 'dsavill-png'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      task: ${{ steps.gate.outputs.task }}
      task_status: ${{ steps.package.outputs.task_status }}
      task_reason: ${{ steps.package.outputs.task_reason }}
      has_patch: ${{ steps.package.outputs.has_patch }}
      pipeline_failure: ${{ steps.package.outputs.pipeline_failure }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate source and release
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]] || exit 0
          id=$(jq -er '.comment.id | numbers | tostring | select(test("^[0-9]+$"))' "$GITHUB_EVENT_PATH")
          record=$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$id")
          body=$(jq -er --arg id "$id" --arg repo "$GITHUB_REPOSITORY" --slurpfile event "$GITHUB_EVENT_PATH" '
            select((.id | tostring) == $id and
              .issue_url == ("https://api.github.com/repos/" + $repo + "/issues/1") and
              .user.login == "dsavill-png" and .user.type == "User" and
              (.created_at | type) == "string" and .created_at == .updated_at and
              .body == $event[0].comment.body) |
            .body | gsub("^\\s+|\\s+$"; "")
          ' <<<"$record") || exit 0
          [[ "$body" =~ ^CODEX\ TASK-([0-9]{3})$ ]] || exit 0
          task=${BASH_REMATCH[1]}
          [[ "$task" != 000 && "$task" != 001 ]] || exit 0
          first_run=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/codex-dispatcher.yml/runs?event=issue_comment&per_page=100" |
            jq -sr --arg title "Codex dispatcher comment $id" '[.[].workflow_runs[] | select(.display_title == $title) | .id] | min')
          [[ "$first_run" == "$GITHUB_RUN_ID" ]] || exit 0
          if [[ "$task" == 998 ]]; then
            printf '%s\n' 'Read AGENTS.md and PLANS.md. This is a reserved blocked-result smoke test. Make no repository changes. Return a completion handoff whose first status line is exactly STATUS: Blocked and whose next non-empty line says Reserved blocked-result smoke test; no work performed.' > "$RUNNER_TEMP/task-prompt"
          elif [[ "$task" == 999 ]]; then
            printf '%s\n' 'Read AGENTS.md and PLANS.md. Create only codex-dispatch-verification.txt containing DEBATEOS_CODEX_PUBLISH_OK followed by a newline. Do not change application files. Finish with a completion handoff whose first status line is exactly STATUS: Completed.' > "$RUNNER_TEMP/task-prompt"
          else
            shopt -s nullglob
            files=(tasks/"$task"-*.md)
            [[ ${#files[@]} == 1 && -f "${files[0]}" && ! -L "${files[0]}" ]] || exit 0
            grep -qxE '\*\*Status\*\* Approved[[:blank:]]*' "${files[0]}" || exit 0
            grep -qxE '\*\*Worker\*\* Codex[[:blank:]]*' "${files[0]}" || exit 0
            grep -qxE '\*\*Dispatch\*\* Released[[:blank:]]*' "${files[0]}" || exit 0
            printf 'Read AGENTS.md, PLANS.md and %s. Implement only the approved work order and run its tests. Do not change dispatcher controls or publish anything.\n' "${files[0]}" > "$RUNNER_TEMP/task-prompt"
          fi
          echo "task=$task" >> "$GITHUB_OUTPUT"
      - name: Run Codex without publishing credentials
        id: codex
        if: steps.gate.outputs.task != ''
        uses: openai/codex-action@306c6a196a99dcc6582530c396a19d2672d5e9ec
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt-file: ${{ runner.temp }}/task-prompt
          output-file: ${{ runner.temp }}/codex-result.txt
      - name: Package and classify result
        id: package
        if: steps.gate.outputs.task != ''
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f "$RUNNER_TEMP/codex-result.txt"
          git add -A
          git diff --cached --binary "$GITHUB_SHA" > "$RUNNER_TEMP/result.patch"

          status_line=$(grep -Eim1 'STATUS.*(Completed|Partial|Blocked)' "$RUNNER_TEMP/codex-result.txt" || true)
          task_status=$(printf '%s' "$status_line" | grep -Eio '(Completed|Partial|Blocked)' | head -1 | tr '[:upper:]' '[:lower:]' || true)
          reason=$(printf '%s\n' "$status_line" | sed -E 's/.*(Completed|Partial|Blocked)[^[:alnum:]]*//; s/^[[:space:]*#_.:—-]+//; s/[[:space:]]+/ /g' | cut -c1-300)
          if [[ -z "$reason" ]]; then
            reason=$(awk '
              BEGIN { IGNORECASE=1; found=0 }
              /STATUS/ && /(Completed|Partial|Blocked)/ { found=1; next }
              found && NF { print; exit }
            ' "$RUNNER_TEMP/codex-result.txt" | sed -E 's/^[[:space:]*#_.:—-]+//; s/[[:space:]]+/ /g' | cut -c1-300)
          fi
          has_patch=false
          [[ -s "$RUNNER_TEMP/result.patch" ]] && has_patch=true
          pipeline_failure=false

          case "$task_status:$has_patch" in
            completed:true|partial:true)
              ;;
            blocked:false)
              [[ -n "$reason" ]] || reason='Codex explicitly reported Blocked; see the Actions run for details.'
              ;;
            blocked:true)
              pipeline_failure=true
              reason='Codex reported Blocked but also changed repository files.'
              ;;
            completed:false|partial:false)
              pipeline_failure=true
              reason='Codex reported work progress without producing a patch.'
              ;;
            *)
              pipeline_failure=true
              task_status=failure
              reason='Codex did not return a recognized Completed, Partial, or Blocked status.'
              ;;
          esac

          echo "task_status=$task_status" >> "$GITHUB_OUTPUT"
          echo "has_patch=$has_patch" >> "$GITHUB_OUTPUT"
          echo "pipeline_failure=$pipeline_failure" >> "$GITHUB_OUTPUT"
          {
            echo 'task_reason<<EOF'
            echo "$reason"
            echo EOF
          } >> "$GITHUB_OUTPUT"

          if [[ "$pipeline_failure" == true ]]; then
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.gate.outputs.task != '' && steps.package.outputs.has_patch == 'true' && steps.package.outputs.task_status != 'blocked'
        with:
          name: codex-patch
          path: ${{ runner.temp }}/result.patch
          retention-days: 1
  publish:
    needs: route
    if: github.run_attempt == '1' && needs.route.outputs.task != '' && needs.route.outputs.has_patch == 'true' && needs.route.outputs.task_status != 'blocked'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: codex-patch
          path: ${{ runner.temp }}/codex-patch
      - name: Validate patch and publish draft
        env:
          GH_TOKEN: ${{ github.token }}
          TASK: ${{ needs.route.outputs.task }}
          SOURCE_ID: ${{ github.event.comment.id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TASK" =~ ^[0-9]{3}$ && "$SOURCE_ID" =~ ^[0-9]+$ ]]
          [[ "$TASK" != 000 && "$TASK" != 001 ]]
          git apply --index "$RUNNER_TEMP/codex-patch/result.patch"
          test -n "$(git diff --cached --name-only)"
          if [[ "$TASK" == 999 ]]; then
            test "$(git diff --cached --name-only)" = codex-dispatch-verification.txt
            test -f codex-dispatch-verification.txt && test ! -L codex-dispatch-verification.txt
            test "$(cat codex-dispatch-verification.txt)" = DEBATEOS_CODEX_PUBLISH_OK
            test "$(git diff --cached --name-status)" = $'A\tcodex-dispatch-verification.txt'
          fi
          git diff --cached --quiet -- .github tasks AGENTS.md PLANS.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch="codex/task-$TASK-comment-$SOURCE_ID"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/heads/$branch" -f sha="$GITHUB_SHA" --jq .ref
          git switch -c "$branch"
          git commit -m "Codex TASK-$TASK from comment $SOURCE_ID"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --draft --base main --head "$branch" --title "Codex TASK-$TASK" --body "Review only. Source comment $SOURCE_ID; Actions run $GITHUB_RUN_ID."
  report:
    needs: [route, publish]
    if: always() && github.run_attempt == '1' && needs.route.outputs.task != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TASK: ${{ needs.route.outputs.task }}
          SOURCE_ID: ${{ github.event.comment.id }}
          TASK_STATUS: ${{ needs.route.outputs.task_status }}
          TASK_REASON: ${{ needs.route.outputs.task_reason }}
          PIPELINE_FAILURE: ${{ needs.route.outputs.pipeline_failure }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TASK -cnotmatch '^[0-9]{3}$' -or $env:SOURCE_ID -cnotmatch '^[0-9]+$') {
            throw 'Invalid dispatcher result identifiers.'
          }

          $link = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $marker = "<!-- debateos-codex-result:$env:SOURCE_ID -->"
          $comments = gh api --paginate "repos/$env:GITHUB_REPOSITORY/issues/1/comments?per_page=100" --jq '.[] | @json'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to check for an existing dispatcher result.' }
          # gh emits one compact JSON object per comment across all pages.
          $existing = @($comments | ForEach-Object { ConvertFrom-Json -InputObject $_ } | Where-Object {
            $_.user.login -ceq 'github-actions[bot]' -and ($_.body -split "\r?\n")[-1] -ceq $marker
          })
          if ($existing.Count -gt 1) { throw 'Multiple dispatcher results found for this source comment.' }
          if ($existing.Count -eq 1) {
            "Dispatcher result already recorded: $($existing[0].html_url)" >> $env:GITHUB_STEP_SUMMARY
            return
          }

          $draft = gh pr list --repo $env:GITHUB_REPOSITORY --head "codex/task-$env:TASK-comment-$env:SOURCE_ID" --state open --json url --jq '.[0].url // ""'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to look up the dispatcher draft PR.' }

          $result = 'failure'
          $nextStep = 'Escalate to Dennis Commander and inspect the Actions run.'
          if ($env:TASK_STATUS -ceq 'blocked' -and $env:PIPELINE_FAILURE -cne 'true') {
            $result = 'blocked'
            $nextStep = 'Review the blocker and decide whether the work order can proceed.'
          } elseif ($env:PUBLISH_RESULT -ceq 'success' -and $env:TASK_STATUS -cin @('completed', 'partial')) {
            $result = @{ completed = 'success'; partial = 'partial' }[$env:TASK_STATUS]
            $nextStep = 'Review the draft PR and decide the next step.'
          }

          $status = if ($env:TASK_STATUS) { $env:TASK_STATUS } else { 'unknown' }
          $draftLink = if ($draft) { $draft } else { 'none' }
          # Keep worker-provided prose on the result line and prevent it from mentioning other accounts.
          $reason = if ($env:TASK_REASON) { ' Reason: ' + ($env:TASK_REASON -replace '[\r\n]+', ' ' -replace '@', '＠') } else { '' }
          $body = @(
            "Codex TASK-$env:TASK result: $result. Task status: ${status}.${reason} Source comment ID $env:SOURCE_ID. Actions: $link. Draft PR: $draftLink."
            ''
            "@dsavill-png — $nextStep"
            ''
            $marker
          ) -join "`n"

          $url = gh api --method POST "repos/$env:GITHUB_REPOSITORY/issues/1/comments" -f "body=$body" --jq .html_url
          if ($LASTEXITCODE -ne 0 -or -not $url) { throw 'Unable to record the dispatcher result.' }
          "Dispatcher result recorded: $url" >> $env:GITHUB_STEP_SUMMARY
